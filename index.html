<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inclusive Layout: review UI screenshots through color blindness, low vision, glare, one-thumb reach and sound-off lenses. Free, private, runs in your browser." />
    <meta name="theme-color" content="#0B6B53" />
    <title>Inclusive Layout</title>
    <script>
      try {
        var t = localStorage.getItem('il-theme');
        if (t === 'light' || t === 'dark' || t === 'system') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Inclusive Layout needs JavaScript to run. Everything stays on your device.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
